services:
  postgres:
    image: postgres:17
    container_name: telegram-cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_cinema
    ports:
      - '5433:5432'
    volumes:
      - telegram-cinema_pgdata:/var/lib/postgresql/data

volumes:
  telegram-cinema_pgdata: